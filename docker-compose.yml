services:
  postgres:
    image: postgres:16-alpine
    container_name: vtt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vtt_admin
      POSTGRES_PASSWORD: vtt_secure_password_123
      POSTGRES_DB: vtt_campaign_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/postgres:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtt_admin -d vtt_campaign_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vtt-net

  redis:
    image: redis:7-alpine
    container_name: vtt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vtt-net

  vtt-engine:
    build:
      context: .
      dockerfile: Dockerfile.rust
    container_name: vtt-engine
    restart: unless-stopped
    environment:
      RUST_LOG: info
      PORT: 8088
      DATABASE_URL: postgres://vtt_admin:vtt_secure_password_123@postgres:5432/vtt_campaign_db
      REDIS_URL: redis://redis:6379
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vtt-net

  vtt-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: vtt-orchestrator
    restart: unless-stopped
    environment:
      ENGINE_API_URL: http://vtt-engine:8088
      DATABASE_URL: postgres://vtt_admin:vtt_secure_password_123@postgres:5432/vtt_campaign_db
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      vtt-engine:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/dynasty/factions || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vtt-net

  vtt-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: vtt-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      vtt-engine:
        condition: service_healthy
      vtt-orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vtt-net

volumes:
  pgdata:
  redisdata:

networks:
  vtt-net:
    driver: bridge
