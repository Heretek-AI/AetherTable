# cargo-deny configuration — pre-push hook dependency policy.
# Accept all common permissive OSS licenses used by the Rust ecosystem.

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

[advisories]
version = 2
ignore = [
    # h2 unbounded empty DATA frames — fix ships in h2 0.4; actix-http 3.x
    # pins h2 0.3 semver. Revisit when actix-web adopts hyper/h2 0.4.
    "RUSTSEC-2026-0258",
    # smartstring unmaintained — transitive via rhai 1.x; no known vuln.
    # Revisit on rhai's next dependency refresh.
    "RUSTSEC-2026-0249",
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
