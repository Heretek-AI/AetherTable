# =============================================================================
# Minimal coturn (TURN/STUN) config for the self-hosted AetherTable stack.
#
# Mounted read-only by the `vtt-coturn` service in docker-compose.yml at
# /etc/coturn/turnserver.conf — the coturn/coturn image's entrypoint passes
# `-c /etc/coturn/turnserver.conf` by default.
#
# Auth mode choice: static-auth-secret (TURN REST API / time-limited
# credentials, draft-uberti-behave-turn-rest) instead of long-term
# credentials (`lt-cred-mech` + `user=...`). Rationale:
#   - Long-term creds require a fixed username/password baked into every
#     client bundle; anyone who reads it owns our relay bandwidth forever.
#   - With use-auth-secret, the server only holds ONE secret (AUTH_SECRET,
#     reused from the rest of the compose stack for self-hosted simplicity)
#     and clients present short-lived HMAC credentials minted per session.
#   - The client currently takes VITE_TURN_USERNAME/VITE_TURN_CREDENTIAL at
#     build time (no credential-minting endpoint exists yet); that means the
#     deployed client must be given a REST-API-shaped credential such as
#     `username=<unix-ts>:<user>` / `credential=base64(hmac(secret, username))`
#     generated out-of-band with:
#         secret=...; user="$(date +%s):user"; \
#         cred=$(printf '%s' "$user" | openssl dgst -binary -sha1 -hmac "$secret" | base64)
#     This is still strictly better than a never-expiring shared password and
#     keeps the door open to minting credentials server-side later.
#
# NOT configured here (documented gaps, not accidents):
#   - TLS/DTLS (tls-listening-port 5349): needs certs; turn: URLs over plain
#     3478 are fine on a trusted/self-hosted network but media stays
#     unencrypted toward the TURN server in TCP-relay fallbacks.
#   - external-ip: required when this host sits behind NAT. Set it via env
#     (COTURN_EXTERNAL_IP) in compose or edit here before deploying publicly;
#     without it, allocations advertise the container's private IP and remote
#     peers cannot reach the relay.
# =============================================================================

# STUN + TURN listener on both UDP and TCP (RFC 5766 / RFC 8489).
listening-port=3478

# Bind inside the container to all interfaces (compose bridge net).
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# Relay port window. Deliberately narrow (49160-49200 = 41 ports ≈ 40
# concurrent relayed sessions) and matched 1:1 by the compose `ports:` block
# so only this range is published to the host.
min-port=49160
max-port=49200

# TURN REST API / static-auth-secret mode. Implies lt-cred-mech internally
# (they are mutually exclusive as explicit options — do not add lt-cred-mech).
#
# The SECRET VALUE itself is NOT written here: docker-compose passes
# `--static-auth-secret=$COTURN_SECRET` on the command line (expanded inside
# the container by the image entrypoint from COTURN_TURN_SECRET/AUTH_SECRET),
# and coturn CLI flags take precedence over this file anyway. Keeping the
# secret out of version control is the whole point.
use-auth-secret

# Realm reported to clients; matches the 'aethertable' naming used across the
# stack (PeerJS key, lobby ids).
realm=aethertable

# Always include fingerprints in TURN messages (integrity check).
fingerprint

# Server can relay to loopback/multicast peers is OFF by default — keep it
# that way. Multicast peers explicitly disallowed as defense-in-depth.
no-multicast-peers

# Do not run as an open relay for arbitrary destinations: nothing beyond the
# default peer-ip filtering is needed for WebRTC (peers are ICE candidates).
no-loopback-peers

# Log to stdout so `docker compose logs vtt-coturn` works.
log-file=stdout
simple-log
