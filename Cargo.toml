[workspace]
resolver = "2"
members = [
    "crates/vtt-core",
    "crates/vtt-spatial",
    "crates/vtt-wfc",
    "crates/vtt-scripting",
    "crates/vtt-crdt-sync",
    "crates/vtt-server",
]

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
dashmap = "6.1"
futures-util = "0.3"
