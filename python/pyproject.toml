[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vtt-orchestrator"
version = "0.1.0"
description = "Multi-Agent Narrative Orchestration and Invariant Auditing Engine for AI VTT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "asyncpg>=0.30.0",
    "numpy>=1.26.0",
    "reportlab>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
# Real semantic embeddings for the Qdrant compendium RAG (see
# vtt_orchestrator/lore/compendium_rag.py). Deliberately NOT a core
# dependency: fastembed pulls ONNX runtime and downloads model weights from
# HuggingFace on first use, which offline CI must never do — without it the
# index degrades to the honest "qdrant-hash-fallback" embedder.
embeddings = [
    "fastembed>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: requires the configured external LLM endpoint and network (opt-in via LLM_KEY + RUN_LIVE_LLM=1; never runs in CI)",
]
