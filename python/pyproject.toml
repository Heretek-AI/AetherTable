[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vtt-orchestrator"
version = "0.1.0"
description = "Multi-Agent Narrative Orchestration and Invariant Auditing Engine for AI VTT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "asyncpg>=0.30.0",
    "numpy>=1.26.0",
    "reportlab>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
