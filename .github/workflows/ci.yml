name: Autonomous AI-Native VTT Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  engine-tests:
    name: Rust Authoritative Engine & Subsystems
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Static-analysis gate: zero warnings tolerated. Verified locally that
      # `cargo clippy --workspace --all-targets` is already warning-free, so
      # this is a regression gate rather than a fix-up burden.
      - name: Clippy Lint (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

  multi-agent-tests:
    name: Python Multi-Agent Tier & Invariant Auditor
    runs-on: ubuntu-latest
    env:
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_KEY: ${{ secrets.LLM_KEY }}
      LLM_API: ${{ secrets.LLM_API }}
      # Env-dependent suites stay skipped in CI by design (honest skip):
      #   * engine-live tests need the Rust gateway (ENGINE_API_URL, default
      #     localhost:8088) — unreachable in CI, so the harness reports
      #     engine_live=False and those assertions skip rather than fail
      #   * live-LLM tests additionally require RUN_LIVE_LLM=1 + a real key
      #     (see python/tests/conftest.py "live" gating)
      ENGINE_API_URL: ""
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -e python/

      - name: Run Pytest Suite with LLM Secrets
        run: |
          PYTHONPATH=python pytest python/tests -v

  benchmarks:
    name: Headless Multi-Agent Playtest Benchmarks
    runs-on: ubuntu-latest
    env:
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_KEY: ${{ secrets.LLM_KEY }}
      LLM_API: ${{ secrets.LLM_API }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -e python/

      - name: Run Full Phase 1-7 Benchmark Suite
        run: ./scripts/run_all_benchmarks.sh

  client-build:
    name: Frontend Presentation & 3D Dice Engine Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      # Unit suite (Vitest, src/**/__tests__/*). Pure in-browser logic — no
      # external services — so it is a hard gate.
      - name: Run Vitest Unit Suite
        working-directory: client
        run: npm run test

      - name: Typecheck & Build Production Client
        working-directory: client
        run: npm run build
