name: Autonomous AI-Native VTT Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  engine-tests:
    name: Rust Authoritative Engine & Subsystems
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

  multi-agent-tests:
    name: Python Multi-Agent Tier & Invariant Auditor
    runs-on: ubuntu-latest
    env:
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_KEY: ${{ secrets.LLM_KEY }}
      LLM_API: ${{ secrets.LLM_API }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -e python/

      - name: Run Pytest Suite with LLM Secrets
        run: |
          PYTHONPATH=python pytest python/tests -v

  benchmarks:
    name: Headless Multi-Agent Playtest Benchmarks
    runs-on: ubuntu-latest
    env:
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_KEY: ${{ secrets.LLM_KEY }}
      LLM_API: ${{ secrets.LLM_API }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -e python/

      - name: Run Full Phase 1-7 Benchmark Suite
        run: ./scripts/run_all_benchmarks.sh

  client-build:
    name: Frontend Presentation & 3D Dice Engine Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Build Production Client
        working-directory: client
        run: npm run build
